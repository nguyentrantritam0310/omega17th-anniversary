  <defs>
    <!-- ============ GRADIENTS ============ -->
    <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13c987"/>
      <stop offset="1" stop-color="#056b40"/>
    </linearGradient>

    <linearGradient id="redMain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3b40"/>
      <stop offset="0.45" stop-color="#e3272d"/>
      <stop offset="1" stop-color="#8f1116"/>

    <linearGradient id="redHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb0b3" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#ff6b70" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ff6b70" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="redText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3b40"/>
      <stop offset="1" stop-color="#c81e24"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a85c"/>
      <stop offset="1" stop-color="#f0daa0"/>
    </linearGradient>

    <linearGradient id="ribbonGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#056b40"/>
      <stop offset="0.5" stop-color="#0fa968"/>
      <stop offset="1" stop-color="#c9a85c"/>
    </linearGradient>

    <linearGradient id="underlineFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3272d" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e3272d" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#c9a85c" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="divGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a85c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c9a85c" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c9a85c" stop-opacity="0"/>

      <stop offset="0" stop-color="#0fa968" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0fa968" stop-opacity="0"/>

      <stop offset="1" stop-color="#c9a85c" stop-opacity="0"/>

      <stop offset="0" stop-color="#e3272d" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#e3272d" stop-opacity="0"/>

      <stop offset="0.6" stop-color="#0fa968"/>

      <stop offset="0.6" stop-color="#c9a85c"/>

      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dx="0" dy="22" result="offsetblur"/>
      <feFlood flood-color="#7a0e12" flood-opacity="0.35"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>

        <feMergeNode in="SourceGraphic"/>
